<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECOAR — demonstração</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224%22 fill=%22%23FF6B35%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22none%22 stroke=%22%23F5A623%22 stroke-width=%222%22/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0}</style>
</head>
<body>
<style>/* ECOAR — plataforma de gestão.
   Base escura editorial, âmbar para pendente (vermelho sugeriria culpa antes
   da validação humana), verde para confirmado, laranja da marca com moderação.
   Densa em informação e legível: ferramenta de uso diário, não landing page. */

:root {
  --fundo: #0e1113;
  --superficie: #171b1e;
  --superficie-alta: #1f2429;
  --borda: #2b3239;
  --texto: #e6e8ea;
  --texto-fraco: #9aa3ab;
  --ambar: #f5a623;
  --verde: #2ecc71;
  --laranja: #ff6b35;
  --vermelho: #e05252;
  --azul: #4a9edb;

  --titulo: "Manrope", "Space Grotesk", system-ui, sans-serif;
  --corpo: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

/* `display` numa classe vence o display:none padrão de [hidden]. Sem esta
   regra, a tela de acesso fica visível acima do painel depois do login. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--corpo);
  font-size: 14px;
  line-height: 1.5;
}

h1, h2, h3 { font-family: var(--titulo); }

button {
  font-family: var(--corpo);
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid transparent;
  padding: 9px 16px;
  cursor: pointer;
}
button:disabled { opacity: 0.5; cursor: not-allowed; }
.secundario { background: transparent; border-color: var(--borda); color: var(--texto-fraco); }
.secundario:hover { color: var(--texto); border-color: var(--texto-fraco); }

a { color: var(--azul); }

/* -- acesso -------------------------------------------------------- */

.acesso { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.cartao-acesso {
  width: min(420px, 100%);
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 32px;
}
.marca { font-family: var(--titulo); font-size: 34px; letter-spacing: 0.18em; margin: 0; }
.tagline { color: var(--texto-fraco); margin: 4px 0 28px; letter-spacing: 0.04em; }
.cartao-acesso label { display: block; margin-bottom: 6px; color: var(--texto-fraco); }
.cartao-acesso input {
  width: 100%; padding: 10px 12px; background: var(--fundo);
  border: 1px solid var(--borda); border-radius: 6px; color: var(--texto);
  font-family: var(--mono); margin-bottom: 16px;
}
.cartao-acesso button[type="submit"] {
  width: 100%; background: var(--laranja); color: #17110d; font-weight: 600;
}
.rodape-acesso {
  margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--borda);
  color: var(--texto-fraco); font-size: 12.5px;
}
.erro { color: var(--vermelho); margin: 12px 0 0; }

/* -- layout com lateral -------------------------------------------- */

#painel { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

.lateral {
  background: var(--superficie);
  border-right: 1px solid var(--borda);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.marca-lateral {
  padding: 18px 20px;
  border-bottom: 1px solid var(--borda);
  display: flex; align-items: center; gap: 10px;
}
.marca-pequena { font-family: var(--titulo); letter-spacing: 0.16em; font-size: 17px; }

.selo-modo {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 3px 7px; border-radius: 4px;
  border: 1px solid var(--ambar); color: var(--ambar);
}
.selo-modo.autuacao { border-color: var(--vermelho); color: var(--vermelho); }

.navegacao { flex: 1; padding: 12px 0; overflow-y: auto; }
.item-nav {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 10px 20px; background: transparent; border: none;
  color: var(--texto-fraco); text-align: left; border-left: 3px solid transparent;
  cursor: pointer; font-size: 13.5px;
}
.item-nav:hover { color: var(--texto); background: var(--superficie-alta); }
.item-nav.ativo { color: var(--texto); border-left-color: var(--laranja); background: var(--superficie-alta); }
.item-nav .contagem {
  font-family: var(--mono); font-size: 11px; background: var(--fundo);
  border-radius: 10px; padding: 1px 8px; color: var(--ambar);
}
.item-nav.so-admin::after { content: "admin"; font-size: 9px; color: var(--texto-fraco); letter-spacing: 0.05em; }

.rodape-lateral {
  padding: 14px 20px; border-top: 1px solid var(--borda);
  display: flex; flex-direction: column; gap: 8px;
}
.quem { font-family: var(--mono); font-size: 11.5px; color: var(--texto-fraco); }

.conteudo { padding: 26px 30px; overflow-y: auto; max-height: 100vh; }

.topo-tela { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
.topo-tela h1 { font-size: 22px; margin: 0; }
.topo-tela .sub { color: var(--texto-fraco); font-size: 13px; }
.acoes-topo { display: flex; gap: 8px; }

/* -- cartões e métricas -------------------------------------------- */

.grade-cartoes {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.cartao {
  background: var(--superficie); border: 1px solid var(--borda);
  border-radius: 8px; padding: 16px 18px;
}
.cartao .valor { font-family: var(--mono); font-size: 26px; line-height: 1.1; }
.cartao .rotulo { color: var(--texto-fraco); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.cartao.pendente .valor { color: var(--ambar); }
.cartao.confirmado .valor { color: var(--verde); }
.cartao.alerta .valor { color: var(--vermelho); }

.aviso-tela {
  background: rgba(245,166,35,0.08); border-left: 3px solid var(--ambar);
  padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px;
  color: var(--texto-fraco); margin-bottom: 22px;
}

/* -- mapa de calor ------------------------------------------------- */

.heatmap { border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
.heatmap th { color: var(--texto-fraco); font-weight: 500; padding: 4px 6px; font-size: 10.5px; }
.heatmap td {
  width: 34px; height: 22px; text-align: center; border: 1px solid var(--fundo);
  color: var(--texto); background: var(--superficie);
}
.heatmap td.hora { color: var(--texto-fraco); background: transparent; text-align: right; padding-right: 8px; }
.legenda-heat { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--texto-fraco); font-size: 12px; }
.escala { width: 120px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--superficie), var(--ambar)); }

/* -- tabelas ------------------------------------------------------- */

.tabela { width: 100%; border-collapse: collapse; }
.tabela th {
  text-align: left; color: var(--texto-fraco); font-weight: 500; font-size: 11.5px;
  text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px;
  border-bottom: 1px solid var(--borda);
}
.tabela td { padding: 9px 10px; border-bottom: 1px solid var(--borda); font-size: 13px; }
.tabela td.num, .tabela th.num { text-align: right; font-family: var(--mono); }
.tabela tr.clicavel { cursor: pointer; }
.tabela tr.clicavel:hover { background: var(--superficie); }

.barra-mini { height: 6px; background: var(--laranja); border-radius: 3px; display: inline-block; vertical-align: middle; }

/* -- estados / etiquetas ------------------------------------------- */

.etiqueta {
  display: inline-block; font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 2px 7px; border-radius: 3px; font-family: var(--mono);
}
.etiqueta.acionar, .etiqueta.confirmado, .etiqueta.confirmado_multa { background: rgba(46,204,113,0.14); color: var(--verde); }
.etiqueta.ambiguo, .etiqueta.pendente_revisao { background: rgba(245,166,35,0.14); color: var(--ambar); }
.etiqueta.rejeitado { background: rgba(154,163,171,0.14); color: var(--texto-fraco); }
.etiqueta.online { background: rgba(46,204,113,0.14); color: var(--verde); }
.etiqueta.offline { background: rgba(224,82,82,0.14); color: var(--vermelho); }

.pilula-integra { color: var(--verde); font-family: var(--mono); }
.pilula-quebrada { color: var(--vermelho); font-family: var(--mono); }

/* -- revisão (duas colunas) ---------------------------------------- */

.revisao { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; }
.coluna-fila { border-right: 1px solid var(--borda); padding-right: 16px; max-height: calc(100vh - 120px); overflow-y: auto; }
.lista-eventos { list-style: none; margin: 0; padding: 0; }
.item {
  padding: 12px 12px; border-bottom: 1px solid var(--borda); cursor: pointer;
  border-left: 3px solid transparent;
}
.item:hover { background: var(--superficie); }
.item.selecionado { background: var(--superficie-alta); border-left-color: var(--laranja); }
.item-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item-classe { font-weight: 600; font-size: 13px; }
.item-score { font-family: var(--mono); font-size: 13px; }
.item-meta { color: var(--texto-fraco); font-size: 12px; margin-top: 3px; font-family: var(--mono); }
.item .etiqueta { margin-top: 7px; margin-right: 5px; }

.grade-medidas {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--borda); border: 1px solid var(--borda);
  border-radius: 8px; overflow: hidden; margin-bottom: 20px;
}
.medida { background: var(--superficie); padding: 12px 14px; }
.medida .rotulo { color: var(--texto-fraco); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.medida .valor { font-family: var(--mono); font-size: 17px; margin-top: 3px; }
.medida .nota { color: var(--texto-fraco); font-size: 11px; margin-top: 3px; }
.medida .nota.alerta { color: var(--ambar); }

.bloco { margin-bottom: 20px; }
.bloco h3 {
  font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--texto-fraco); margin: 0 0 10px;
}
audio { width: 100%; }
.aviso-audio { color: var(--texto-fraco); font-size: 11.5px; margin-top: 6px; }
.imagens { display: flex; gap: 12px; flex-wrap: wrap; }
.imagens img { max-width: 260px; border: 1px solid var(--borda); border-radius: 6px; display: block; }
.imagens figcaption { color: var(--texto-fraco); font-size: 11.5px; margin-top: 5px; font-family: var(--mono); }

.regras { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; }
.regras li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--borda); align-items: baseline; }
.regras .marca-ok { color: var(--verde); }
.regras .marca-nao { color: var(--ambar); }
.regras .medido { color: var(--texto-fraco); }
.regras .nome { font-family: var(--corpo); }

/* Painel "por que este resultado": o motivo determinístico do nó + o que o
   status significa. É o que ajuda o operador (e o apresentador) a ler a tela. */
.porque {
  background: var(--superficie); border: 1px solid var(--borda);
  border-left: 3px solid var(--laranja); border-radius: 0 8px 8px 0;
  padding: 14px 16px; margin-bottom: 20px;
}
.porque h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--texto-fraco); margin: 0 0 8px; }
.porque-motivo { margin: 0 0 8px; font-size: 13.5px; }
.porque-status { margin: 0; font-size: 12.5px; color: var(--texto-fraco); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

.hash { font-family: var(--mono); font-size: 11.5px; color: var(--texto-fraco); word-break: break-all; }
.explicacao { background: var(--superficie); border-left: 3px solid var(--laranja); padding: 12px 14px; border-radius: 0 6px 6px 0; font-size: 13px; }

.decisao { border: 1px solid var(--borda); border-radius: 8px; padding: 18px; background: var(--superficie); }
.decisao textarea {
  width: 100%; min-height: 66px; background: var(--fundo); border: 1px solid var(--borda);
  border-radius: 6px; color: var(--texto); font-family: var(--corpo); padding: 10px;
  resize: vertical; margin-bottom: 12px;
}
.botoes-decisao { display: flex; gap: 10px; }
.confirmar { background: var(--verde); color: #06240f; font-weight: 600; }
.rejeitar { background: transparent; border-color: var(--vermelho); color: var(--vermelho); }

.historico { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.historico li { padding: 8px 0; border-bottom: 1px solid var(--borda); }
.historico .quem { font-family: var(--mono); color: var(--texto-fraco); font-size: 12px; }

.mensagem { padding: 10px 12px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
.mensagem.ok { background: rgba(46,204,113,0.12); color: var(--verde); }
.mensagem.falha { background: rgba(224,82,82,0.12); color: var(--vermelho); }

.vazio, .placeholder { color: var(--texto-fraco); padding: 28px 4px; }
.placeholder .dica { max-width: 46ch; margin-top: 10px; font-size: 13px; }

.filtros { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filtros select, .filtros input {
  background: var(--superficie); border: 1px solid var(--borda); color: var(--texto);
  border-radius: 6px; padding: 7px 10px; font-family: var(--corpo);
}

/* -- barra de eventos por dia -------------------------------------- */

.barras { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 8px; }
.barra-dia { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-width: 8px; }
.barra-dia .seg-conf { background: var(--verde); border-radius: 2px 2px 0 0; }
.barra-dia .seg-rej { background: var(--texto-fraco); }
.barra-rotulos { display: flex; gap: 3px; margin-top: 6px; }
.barra-rotulos span { flex: 1; text-align: center; font-size: 9px; color: var(--texto-fraco); font-family: var(--mono); }

@media (max-width: 820px) {
  #painel { grid-template-columns: 1fr; }
  .lateral { position: static; height: auto; flex-direction: row; flex-wrap: wrap; }
  .navegacao { display: flex; flex-wrap: wrap; }
  .revisao { grid-template-columns: 1fr; }
  .coluna-fila { border-right: none; max-height: none; }
}

/* -- demonstração: faixa e sobreposição do relatório --------------- */
.faixa-demo {
  position: fixed; top: 0; right: 0; z-index: 50;
  background: var(--laranja); color: #17110d; font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 12px; border-bottom-left-radius: 6px; font-weight: 600;
}
.sobreposicao-relatorio {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.72);
  display: grid; place-items: center; padding: 24px;
}
.janela-relatorio {
  width: min(900px, 100%); height: min(90vh, 100%);
  background: #fff; border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column;
}
.barra-relatorio {
  display: flex; gap: 8px; justify-content: flex-end;
  padding: 10px 12px; background: var(--superficie); border-bottom: 1px solid var(--borda);
}
.barra-relatorio button { font-size: 13px; }
.barra-relatorio #imprimir-rel { background: var(--laranja); color: #17110d; font-weight: 600; }
.janela-relatorio iframe { border: 0; width: 100%; flex: 1; background: #fff; }

/* -- tour guiado (demonstração) ---------------------------------- */
.tour-hi {
  position: fixed; z-index: 200; border-radius: 8px; pointer-events: none;
  box-shadow: 0 0 0 4px var(--laranja), 0 0 0 9999px rgba(6,8,10,0.74);
  transition: all 0.25s ease;
}
.tour-card {
  position: fixed; z-index: 201; width: min(340px, calc(100vw - 32px));
  background: var(--superficie-alta); border: 1px solid var(--borda);
  border-radius: 12px; padding: 18px 18px 16px; box-shadow: 0 16px 50px rgba(0,0,0,0.5);
}
.tour-card h4 { margin: 0 0 8px; font-family: var(--titulo); font-size: 16px; }
.tour-card p { margin: 0 0 14px; font-size: 13.5px; color: var(--texto); line-height: 1.55; }
.tour-card .passo-n { font-family: var(--mono); font-size: 11px; color: var(--texto-fraco); }
.tour-botoes { display: flex; align-items: center; gap: 8px; }
.tour-botoes .espaco { flex: 1; }
.tour-botoes button { font-size: 13px; padding: 7px 14px; border-radius: 7px; }
.tour-prox { background: var(--laranja); color: #17110d; font-weight: 700; border: none; }
.tour-ant { background: transparent; border: 1px solid var(--borda); color: var(--texto-fraco); }
.tour-pular { background: transparent; border: none; color: var(--texto-fraco); font-size: 12px; }
.tour-pular:hover { color: var(--texto); }
.tour-ajuda {
  position: fixed; left: 18px; bottom: 18px; z-index: 120;
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--borda);
  background: var(--superficie-alta); color: var(--ambar); font-size: 18px;
  cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.tour-ajuda:hover { border-color: var(--ambar); }
@media (prefers-reduced-motion: reduce) { .tour-hi { transition: none; } }
</style>
<div class="faixa-demo" title="Dados de exemplo — não é captura de campo">demonstração · dados de exemplo</div>
<div id="acesso" class="acesso">
  <form class="cartao-acesso" id="form-acesso">
    <h1 class="marca">ECOAR</h1>
    <p class="tagline">Ouve. Confirma. Prova.</p>
    <label for="token">Token de operador</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <p class="erro" id="erro-acesso" hidden></p>
    <p class="rodape-acesso">
      Sistema em <strong>modo de triagem</strong>: os eventos confirmados
      alimentam a priorização de fiscalização. Não geram autuação.
    </p>
  </form>
</div>

<div id="painel" hidden>
  <aside class="lateral">
    <div class="marca-lateral">
      <span class="marca-pequena">ECOAR</span>
      <span class="selo-modo" id="selo-modo">triagem</span>
    </div>
    <nav class="navegacao" id="navegacao"></nav>
    <div class="rodape-lateral">
      <span class="quem" id="quem"></span>
      <button class="secundario" id="sair">Sair</button>
    </div>
  </aside>

  <main class="conteudo" id="conteudo"></main>
</div>
<script>/* Retrato dos dados da B, congelado por scripts/exportar_demo.py.
   NÃO editar à mão: rode o script de novo para atualizar.

e='Segunda 20h: 1'>1<\/td><td style='background: rgba(245,166,35,0.47)' title='Terça 20h: 2'>2<\/td><td style='background: rgba(245,166,35,0.47)' title='Quarta 20h: 2'>2<\/td><td style='background: rgba(245,166,35,0.65)' title='Quinta 20h: 3'>3<\/td><td style='background: rgba(245,166,35,0.47)' title='Sexta 20h: 2'>2<\/td><td style='background: rgba(245,166,35,1.00)' title='Sábado 20h: 5'>5<\/td><\/tr><tr><th>21h<\/th><td style='' title='Domingo 21h: 0'><\/td><td style='background: rgba(245,166,35,0.65)' title='Segunda 21h: 3'>3<\/td><td style='background: rgba(245,166,35,0.82)' title='Terça 21h: 4'>4<\/td><td style='background: rgba(245,166,35,0.65)' title='Quarta 21h: 3'>3<\/td><td style='' title='Quinta 21h: 0'><\/td><td style='background: rgba(245,166,35,0.47)' title='Sexta 21h: 2'>2<\/td><td style='background: rgba(245,166,35,0.47)' title='Sábado 21h: 2'>2<\/td><\/tr><tr><th>22h<\/th><td style='' title='Domingo 22h: 0'><\/td><td style='background: rgba(245,166,35,0.30)' title='Segunda 22h: 1'>1<\/td><td style='' title='Terça 22h: 0'><\/td><td style='background: rgba(245,166,35,0.30)' title='Quarta 22h: 1'>1<\/td><td style='background: rgba(245,166,35,0.30)' title='Quinta 22h: 1'>1<\/td><td style='background: rgba(245,166,35,0.47)' title='Sexta 22h: 2'>2<\/td><td style='background: rgba(245,166,35,1.00)' title='Sábado 22h: 5'>5<\/td><\/tr><tr><th>23h<\/th><td style='' title='Domingo 23h: 0'><\/td><td style='' title='Segunda 23h: 0'><\/td><td style='' title='Terça 23h: 0'><\/td><td style='background: rgba(245,166,35,0.30)' title='Quarta 23h: 1'>1<\/td><td style='background: rgba(245,166,35,0.30)' title='Quinta 23h: 1'>1<\/td><td style='background: rgba(245,166,35,0.47)' title='Sexta 23h: 2'>2<\/td><td style='background: rgba(245,166,35,0.47)' title='Sábado 23h: 2'>2<\/td><\/tr>\n  <\/table>\n\n  <h2>Onde o problema é pior<\/h2>\n  <table>\n    <tr><th>Nó<\/th><th>Local<\/th><th>Eventos confirmados<\/th><\/tr>\n    <tr><td>piracicaba-kennedy-01<\/td><td>Av. Presid <script>/* ECOAR — plataforma de gestão do operador.
   Sem framework e sem etapa de build: o piloto precisa subir num servidor
   simples, e uma dependência de node no município é atrito que não paga.

   O token fica em sessionStorage, não em localStorage: fechou o navegador,
   perdeu a sessão. É um terminal compartilhado de repartição. */

const ARMAZEM = "ecoar.token";
const estado = {
  token: null,
  eu: null,
  tela: "priorizacao",
  contagem: {},
  selecionado: null,
  filtroHistorico: "",
  blobs: [],
};

const $ = (id) => document.getElementById(id);

/* Telas. `admin: true` só aparece para o perfil admin (RBAC no cliente; o
   backend recusa de novo, que é onde a garantia mora). */
const TELAS = [
  { id: "priorizacao", nome: "Priorização", render: telaPriorizacao },
  { id: "revisao", nome: "Fila de revisão", render: telaRevisao, badge: "pendente_revisao" },
  { id: "nos", nome: "Nós", render: telaNos },
  { id: "violacoes", nome: "Violações", render: telaViolacoes },
  { id: "historico", nome: "Histórico", render: telaHistorico },
  { id: "metricas", nome: "Métricas", render: telaMetricas },
  { id: "modelo", nome: "Modelo", render: telaModelo, admin: true },
  { id: "auditoria", nome: "Auditoria", render: telaAuditoria, admin: true },
  { id: "config", nome: "Configurações", render: telaConfig },
];

/* -- rede --------------------------------------------------------- */

/* DEMONSTRAÇÃO: no lugar da rede, lê o retrato congelado da B (window.DEMO).
   Mesma assinatura de api(): o resto do painel não sabe que não há servidor. */
const D = window.DEMO;
function _contagem() {
  const c = { pendente_revisao: 0, confirmado: 0, confirmado_multa: 0, rejeitado: 0 };
  D.eventos.eventos.forEach((e) => { c[e.status] = (c[e.status] || 0) + 1; });
  return c;
}
function _listarEventos(p) {
  const status = p.get("status");
  const noId = p.get("no_id");
  const limite = Number(p.get("limite") || 50);
  let evs = D.eventos.eventos.slice();
  if (status) evs = evs.filter((e) => e.status === status);
  if (noId) evs = evs.filter((e) => e.no_id === noId);
  evs.sort((a, b) => (a.capturado_em < b.capturado_em ? 1 : -1));
  return { total: evs.length, contagem: _contagem(), eventos: evs.slice(0, limite) };
}
function _revisar(id, corpo) {
  const novo = corpo.decisao === "confirmar" ? "confirmado" : "rejeitado";
  const ev = D.eventos.eventos.find((e) => String(e.id) === String(id));
  if (ev) ev.status = novo;
  const det = D.detalhes[id];
  if (det) {
    det.status = novo;
    (det.revisoes = det.revisoes || []).push({
      operador: estado.eu.nome, decisao: corpo.decisao,
      observacao: corpo.observacao || "",
      decidido_em: new Date().toISOString(),
    });
  }
  return { id: Number(id), status: novo, operador: estado.eu.nome };
}
function _atender(id) {
  const v = D.violacoes.violacoes.find((x) => String(x.id) === String(id));
  if (v) v.atendido = true;
  return { status: "atendido", id: Number(id) };
}
async function api(caminho, opcoes = {}) {
  await new Promise((r) => setTimeout(r, 45)); // leve latência: parece a rede real
  const metodo = (opcoes.method || "GET").toUpperCase();
  const [caminhoBase, consulta] = caminho.split("?");
  const p = new URLSearchParams(consulta || "");
  let m;
  switch (caminhoBase) {
    case "/v1/eu": return estado.eu;
    case "/v1/priorizacao": return D.priorizacao;
    case "/v1/nos": return D.nos;
    case "/v1/violacoes": return D.violacoes;
    case "/v1/metricas": return D.metricas;
    case "/v1/modelo/versoes": return D.modelo;
    case "/v1/nos/modos": return D.modos;
    case "/v1/auditoria/verificar": return D.auditoria_verif;
    case "/v1/auditoria": return D.auditoria;
    case "/v1/eventos": return _listarEventos(p);
  }
  if ((m = caminhoBase.match(/^\/v1\/eventos\/(\d+)$/))) return D.detalhes[m[1]];
  if ((m = caminhoBase.match(/^\/v1\/eventos\/(\d+)\/revisao$/)) && metodo === "POST")
    return _revisar(m[1], JSON.parse(opcoes.body || "{}"));
  if ((m = caminhoBase.match(/^\/v1\/violacoes\/(\d+)\/atender$/)) && metodo === "POST")
    return _atender(m[1]);
  throw new Error("rota de demonstração desconhecida: " + caminhoBase);
}

/* <img>/<audio> não enviam cabeçalho de autenticação: a mídia voltaria 401.
   Busca por fetch com o token e entrega como blob. Assinar a URL colocaria
   credencial no histórico do navegador e no log do servidor. */
async function carregarMidia(elemento) {
  const origem = elemento.dataset.src || "";
  const url = origem.includes("/audio-audicao") ? D.midia_audio
    : origem.includes("/midia/") ? D.midia_imagem : null;
  if (url) { elemento.src = url; return; }
  elemento.replaceWith(Object.assign(document.createElement("p"), {
    className: "aviso-audio", textContent: "mídia de exemplo indisponível",
  }));
}
function liberarMidia() {
  estado.blobs.forEach((url) => URL.revokeObjectURL(url));
  estado.blobs = [];
}

/* -- acesso ------------------------------------------------------- */

$("form-acesso").addEventListener("submit", (evento) => {
  evento.preventDefault();
  /* DEMONSTRAÇÃO: qualquer token entra. Um token com "operador" entra com o
     perfil de operador (sem Modelo e Auditoria); o resto entra como admin, para
     a apresentação poder mostrar todas as telas. */
  const valor = ($("token").value || "").trim().toLowerCase();
  estado.token = "demo";
  estado.eu = valor.includes("operador") ? D.eu_operador : D.eu_admin;
  abrirPainel();
  setTimeout(() => window.__ecoarTour && window.__ecoarTour.aoEntrar(), 400);
});

function sair() {
  sessionStorage.removeItem(ARMAZEM);
  estado.token = null;
  estado.eu = null;
  $("painel").hidden = true;
  $("acesso").hidden = false;
}
$("sair").addEventListener("click", sair);

function abrirPainel() {
  $("acesso").hidden = true;
  $("painel").hidden = false;
  $("quem").textContent = `${estado.eu.nome} · ${estado.eu.perfil}`;
  desenharNavegacao();
  irPara("priorizacao");
}

/* -- navegação ---------------------------------------------------- */

function telasVisiveis() {
  return TELAS.filter((tela) => !tela.admin || estado.eu.admin);
}

function desenharNavegacao() {
  $("navegacao").innerHTML = telasVisiveis()
    .map(
      (tela) => `<button class="item-nav ${tela.admin ? "so-admin" : ""}" data-tela="${tela.id}">
        <span>${tela.nome}</span>
        ${tela.badge ? `<span class="contagem" data-badge="${tela.badge}" hidden></span>` : ""}
      </button>`
    )
    .join("");
  $("navegacao").querySelectorAll(".item-nav").forEach((botao) => {
    botao.addEventListener("click", () => irPara(botao.dataset.tela));
  });
}

async function irPara(id) {
  estado.tela = id;
  liberarMidia();
  $("navegacao").querySelectorAll(".item-nav").forEach((b) => {
    b.classList.toggle("ativo", b.dataset.tela === id);
  });
  const tela = TELAS.find((t) => t.id === id);
  $("conteudo").innerHTML = `<div class="placeholder">Carregando ${tela.nome.toLowerCase()}…</div>`;
  try {
    await tela.render();
  } catch (erro) {
    $("conteudo").innerHTML = `<div class="mensagem falha">${texto(erro.message)}</div>`;
  }
  atualizarBadges();
}

async function atualizarBadges() {
  try {
    const dados = await api("/v1/eventos?limite=1");
    estado.contagem = dados.contagem;
    document.querySelectorAll("[data-badge]").forEach((elemento) => {
      const valor = estado.contagem[elemento.dataset.badge] || 0;
      elemento.textContent = valor;
      elemento.hidden = valor === 0;
    });
  } catch { /* silencioso: badge é secundário */ }
}

/* -- tela: priorização (home) ------------------------------------- */

const DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

async function telaPriorizacao() {
  const dados = await api("/v1/priorizacao");
  const grade = {};
  let maximo = 0;
  dados.hora_dia.forEach((c) => {
    grade[`${c.dia}-${c.hora}`] = c.total;
    maximo = Math.max(maximo, c.total);
  });

  const linhas = [];
  for (let hora = 0; hora < 24; hora++) {
    const celulas = DIAS.map((_, dia) => {
      const total = grade[`${dia}-${hora}`] || 0;
      const i = maximo ? total / maximo : 0;
      const fundo = total ? `background: rgba(245,166,35,${(0.12 + 0.88 * i).toFixed(2)}); color:#14181b` : "";
      return `<td style="${fundo}" title="${DIAS[dia]} ${hora}h: ${total}">${total || ""}</td>`;
    }).join("");
    linhas.push(`<tr><td class="hora">${String(hora).padStart(2, "0")}h</td>${celulas}</tr>`);
  }

  const ranking = dados.por_no.length
    ? dados.por_no
        .map(
          (no) => `<tr>
            <td>${texto(no.no_id)}</td>
            <td>${texto(no.descricao || "—")}</td>
            <td class="num">${no.confirmados}</td>
            <td><span class="barra-mini" style="width:${maxBarra(no.confirmados, dados.por_no)}px"></span></td>
          </tr>`
        )
        .join("")
    : `<tr><td colspan="4" class="vazio">Nenhum evento confirmado ainda. O mapa
        se preenche conforme o operador confirma ocorrências.</td></tr>`;

  $("conteudo").innerHTML = `
    <div class="topo-tela">
      <div><h1>Priorização de fiscalização</h1>
        <div class="sub">Onde e quando o problema é pior — para direcionar a blitz</div></div>
      <div class="acoes-topo">
        <button class="secundario" id="btn-relatorio">Exportar relatório</button>
      </div>
    </div>
    <div class="aviso-tela">${texto(dados.observacao)}</div>

    <div class="bloco">
      <h3>Quando — eventos confirmados por dia da semana × hora</h3>
      <table class="heatmap">
        <tr><th></th>${DIAS.map((d) => `<th>${d}</th>`).join("")}</tr>
        ${linhas.join("")}
      </table>
      <div class="legenda-heat"><span>menos</span><span class="escala"></span><span>mais</span></div>
    </div>

    <div class="bloco">
      <h3>Onde — pontos por eventos confirmados</h3>
      <table class="tabela">
        <tr><th>Nó</th><th>Local</th><th class="num">Confirmados</th><th></th></tr>
        ${ranking}
      </table>
    </div>`;

  $("btn-relatorio").addEventListener("click", exportarRelatorio);
}

function maxBarra(valor, lista) {
  const max = Math.max(...lista.map((n) => n.confirmados), 1);
  return Math.round((valor / max) * 120);
}

function exportarRelatorio() {
  /* DEMONSTRAÇÃO: abre o relatório real (capturado da B) numa sobreposição com
     botão de imprimir — sem depender de janela nova, que o sandbox pode bloquear. */
  const fundo = document.createElement("div");
  fundo.className = "sobreposicao-relatorio";
  fundo.innerHTML = `
    <div class="janela-relatorio">
      <div class="barra-relatorio">
        <button class="secundario" id="fechar-rel">Fechar</button>
        <button id="imprimir-rel">Imprimir / salvar PDF</button>
      </div>
      <iframe id="quadro-rel"></iframe>
    </div>`;
  document.body.appendChild(fundo);
  document.getElementById("quadro-rel").srcdoc = D.relatorio;
  document.getElementById("fechar-rel").onclick = () => fundo.remove();
  document.getElementById("imprimir-rel").onclick = () => {
    const q = document.getElementById("quadro-rel");
    q.contentWindow.focus();
    q.contentWindow.print();
  };
}

/* -- tela: fila de revisão ---------------------------------------- */

async function telaRevisao() {
  const dados = await api("/v1/eventos?status=pendente_revisao&limite=200");
  estado.eventos = dados.eventos;
  $("conteudo").innerHTML = `
    <div class="topo-tela"><div><h1>Fila de revisão</h1>
      <div class="sub">Todo evento passa por decisão humana antes de virar dado de priorização</div></div></div>
    <div class="revisao">
      <div class="coluna-fila"><ul class="lista-eventos" id="lista"></ul>
        <p class="vazio" id="vazio" hidden>Fila vazia. Nada pendente.</p></div>
      <div id="detalhe"><div class="placeholder"><p>Selecione um evento na fila.</p>
        <p class="dica">Nenhum evento é contado sozinho: a priorização se alimenta
        do que você confirmar aqui.</p></div></div>
    </div>`;
  desenharListaRevisao();
}

function desenharListaRevisao() {
  const lista = $("lista");
  $("vazio").hidden = estado.eventos.length > 0;
  lista.innerHTML = estado.eventos
    .map((evento) => {
      const score = evento.score_alvo == null ? "—" : evento.score_alvo.toFixed(2);
      const ang = evento.azimute_graus == null ? "—" : `${evento.azimute_graus.toFixed(0)}°`;
      return `<li class="item ${estado.selecionado === evento.id ? "selecionado" : ""}" data-id="${evento.id}">
        <div class="item-topo"><span class="item-classe">${texto(evento.classe) || "—"}</span>
          <span class="item-score">${score}</span></div>
        <div class="item-meta">${quando(evento.capturado_em)} · ${evento.no_id} · ${ang}</div>
        <span class="etiqueta ${evento.acao}">${evento.acao}</span>
      </li>`;
    })
    .join("");
  lista.querySelectorAll(".item").forEach((el) => {
    el.addEventListener("click", () => abrirEvento(Number(el.dataset.id)));
  });
}

async function abrirEvento(id) {
  liberarMidia();
  estado.selecionado = id;
  desenharListaRevisao();
  const evento = await api(`/v1/eventos/${id}`);
  desenharDetalhe(evento);
}

function desenharDetalhe(evento) {
  const manifesto = evento.manifesto || {};
  const decisao = manifesto.decisao || {};
  const classificacao = manifesto.classificacao || {};
  const pendente = evento.status === "pendente_revisao";

  $("detalhe").innerHTML = `
    <div class="topo-tela"><div><h1 style="font-size:19px">${texto(evento.classe) || "evento"}</h1>
      <div class="sub">${evento.evento_id} · ${evento.no_id} · ${quando(evento.capturado_em)}</div></div>
      <span class="etiqueta ${evento.status}">${rotuloStatus(evento.status)}</span></div>
    <div id="mensagem"></div>
    <div class="grade-medidas">
      ${medida("Score do alvo", numero(evento.score_alvo, 2), evento.versao_modelo)}
      ${medida("Ângulo", evento.azimute_graus == null ? "—" : `${numero(evento.azimute_graus, 1)}°`,
        evento.margem_graus == null ? "" : `±${numero(evento.margem_graus, 1)}° · conf. ${numero(evento.confianca_doa, 2)}`)}
      ${medida("Nível estimado", evento.spl_db == null ? "—" : `${numero(evento.spl_db, 1)} dB`, "sem valor legal — array MEMS", true)}
      ${medida("Decisão do nó", evento.acao, evento.versao_politica)}
    </div>
    <div class="porque">
      <h3>Por que este resultado</h3>
      ${decisao.motivo ? `<p class="porque-motivo">${texto(decisao.motivo)}</p>` : ""}
      <p class="porque-status"><span class="etiqueta ${evento.status}">${rotuloStatus(evento.status)}</span>
        ${explicacaoStatus(evento.status)}</p>
    </div>
    <div class="bloco"><h3>Áudio do evento</h3>
      <audio controls preload="none" data-src="/v1/eventos/${evento.id}/audio-audicao.wav"></audio>
      <p class="aviso-audio">Mono 16 bits, só para audição. A evidência é o áudio de 4 canais dentro do pacote.</p></div>
    ${imagensBloco(evento, manifesto)}
    ${classificacao.explicacao ? `<div class="bloco"><h3>Por que o classificador decidiu assim</h3>
      <div class="explicacao">${texto(classificacao.explicacao)}</div></div>` : ""}
    ${regrasBloco(decisao)}
    <div class="bloco"><h3>Integridade</h3><p class="hash">${texto(evento.hash_manifesto)}</p></div>
    ${pendente ? `<div class="decisao"><h3>Sua decisão</h3>
      <textarea id="observacao" placeholder="Observação (opcional) — fica registrada com o seu nome"></textarea>
      <div class="botoes-decisao">
        <button class="confirmar" id="btn-confirmar">Confirmar ocorrência</button>
        <button class="rejeitar" id="btn-rejeitar">Rejeitar</button>
      </div></div>` : ""}
    ${historicoBloco(evento.revisoes)}`;

  document.querySelectorAll("[data-src]").forEach(carregarMidia);
  if (pendente) {
    $("btn-confirmar").addEventListener("click", () => decidir(evento.id, "confirmar"));
    $("btn-rejeitar").addEventListener("click", () => decidir(evento.id, "rejeitar"));
  }
}

function imagensBloco(evento, manifesto) {
  const imagens = manifesto.imagens || [];
  if (!imagens.length) {
    return `<div class="bloco"><h3>Imagens</h3><p class="dica">Sem imagem: a câmera
      não foi acionada — o evento ficou ambíguo e entrou na fila mesmo assim.</p></div>`;
  }
  const figuras = imagens.map((im) => {
    const nome = (im.arquivo || "").replace("midia/", "");
    const sim = im.simulada ? " · CAPTURA SIMULADA" : "";
    return `<figure><img data-src="/v1/eventos/${evento.id}/midia/${nome}" alt="${texto(im.tipo)}">
      <figcaption>${texto(im.tipo)} · ${texto(im.resolucao)}${sim}</figcaption></figure>`;
  }).join("");
  return `<div class="bloco"><h3>Imagens</h3><div class="imagens">${figuras}</div></div>`;
}

function regrasBloco(decisao) {
  const regras = decisao.regras || [];
  if (!regras.length) return "";
  const itens = regras.map((r) => `<li>
    <span class="${r.atendida ? "marca-ok" : "marca-nao"}">${r.atendida ? "✓" : "✗"}</span>
    <span class="nome">${texto(r.nome)}</span><span class="medido">${texto(r.medido)}</span></li>`).join("");
  return `<div class="bloco"><h3>Regras avaliadas pelo nó — ${texto(decisao.versao_politica)}</h3>
    <ul class="regras">${itens}</ul></div>`;
}

function historicoBloco(revisoes) {
  if (!revisoes || !revisoes.length) return "";
  const itens = revisoes.map((r) => `<li><div class="quem">${texto(r.operador)} · ${texto(r.decidido_em)}</div>
    <div>${texto(r.decisao)}${r.observacao ? " — " + texto(r.observacao) : ""}</div></li>`).join("");
  return `<div class="bloco"><h3>Histórico de revisão</h3><ul class="historico">${itens}</ul></div>`;
}

async function decidir(id, decisao) {
  const observacao = $("observacao")?.value || "";
  try {
    await api(`/v1/eventos/${id}/revisao`, { method: "POST", body: JSON.stringify({ decisao, observacao }) });
    await telaRevisao();
    await abrirEvento(id);
    const alvo = $("mensagem");
    if (alvo) alvo.innerHTML = `<div class="mensagem ok">Evento ${decisao === "confirmar" ? "confirmado" : "rejeitado"}.</div>`;
  } catch (erro) {
    const alvo = $("mensagem");
    if (alvo) alvo.innerHTML = `<div class="mensagem falha">${texto(erro.message)}</div>`;
  }
}

/* -- tela: nós ---------------------------------------------------- */

async function telaNos() {
  const dados = await api("/v1/nos");
  const agora = Date.now();
  const linhas = dados.nos.map((no) => {
    const hb = no.ultimo_heartbeat ? new Date(no.ultimo_heartbeat + "Z").getTime() : null;
    const online = hb && agora - hb < 15 * 60 * 1000;
    return `<tr>
      <td>${texto(no.no_id)}</td>
      <td>${texto(no.descricao || "—")}</td>
      <td><span class="etiqueta ${online ? "online" : "offline"}">${online ? "online" : "sem sinal"}</span></td>
      <td class="num">${no.bateria_pct == null ? "—" : no.bateria_pct.toFixed(0) + "%"}</td>
      <td class="num">${no.pendentes}</td>
      <td>${no.ultimo_heartbeat ? quando(no.ultimo_heartbeat + "Z") : "—"}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="vazio">Nenhum nó registrou contato ainda.</td></tr>`;

  $("conteudo").innerHTML = `
    <div class="topo-tela"><div><h1>Nós instalados</h1>
      <div class="sub">Um nó é considerado sem sinal após 15 min sem heartbeat</div></div></div>
    <table class="tabela">
      <tr><th>Nó</th><th>Local</th><th>Estado</th><th class="num">Bateria</th>
          <th class="num">Pendentes</th><th>Último heartbeat</th></tr>
      ${linhas}
    </table>`;
}

/* -- tela: métricas ----------------------------------------------- */

async function telaMetricas() {
  const dados = await api("/v1/metricas");
  const r = dados.rejeicao;
  const taxa = r.taxa_rejeicao == null ? "—" : (r.taxa_rejeicao * 100).toFixed(1) + "%";

  const dias = dados.por_dia.slice().reverse();
  const maxDia = Math.max(...dias.map((d) => d.total), 1);
  const barras = dias.map((d) => {
    const h = 132;
    return `<div class="barra-dia" title="${d.dia}: ${d.confirmados} conf., ${d.rejeitados} rej.">
      <div class="seg-rej" style="height:${(d.rejeitados / maxDia) * h}px"></div>
      <div class="seg-conf" style="height:${(d.confirmados / maxDia) * h}px"></div></div>`;
  }).join("");
  const rotulos = dias.map((d) => `<span>${d.dia.slice(5)}</span>`).join("");

  $("conteudo").innerHTML = `
    <div class="topo-tela"><div><h1>Métricas</h1>
      <div class="sub">Volume operacional e taxa de rejeição na revisão</div></div></div>
    <div class="grade-cartoes">
      ${cartao("confirmado", r.confirmados, "Confirmados")}
      ${cartao("", r.rejeitados, "Rejeitados")}
      ${cartao("pendente", r.pendentes, "Pendentes")}
      ${cartao("", taxa, "Taxa de rejeição")}
    </div>
    <div class="bloco"><h3>Eventos por dia — confirmados (verde) e rejeitados (cinza)</h3>
      ${dias.length ? `<div class="barras">${barras}</div><div class="barra-rotulos">${rotulos}</div>`
        : `<p class="vazio">Sem eventos ainda.</p>`}</div>
    <div class="aviso-tela">${texto(dados.nota_custo)}</div>`;
}

/* -- utilidades --------------------------------------------------- */

function cartao(classe, valor, rotulo) {
  return `<div class="cartao ${classe}"><div class="valor">${texto(valor)}</div>
    <div class="rotulo">${texto(rotulo)}</div></div>`;
}
function medida(rotulo, valor, nota = "", alerta = false) {
  return `<div class="medida"><div class="rotulo">${texto(rotulo)}</div>
    <div class="valor">${texto(valor)}</div>
    ${nota ? `<div class="nota ${alerta ? "alerta" : ""}">${texto(nota)}</div>` : ""}</div>`;
}
function numero(valor, casas) { return valor == null ? "—" : Number(valor).toFixed(casas); }
function quando(iso) {
  if (!iso) return "—";
  const data = new Date(iso);
  return Number.isNaN(data.getTime()) ? iso
    : data.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
}
function rotuloStatus(s) {
  return { pendente_revisao: "pendente", confirmado: "confirmado",
    confirmado_multa: "confirmado (multa)", rejeitado: "rejeitado" }[s] || s;
}
/* O "porquê" do status, em uma frase — o que o nó decide é determinístico, mas
   o status é sempre resultado de (ou espera por) decisão humana (D2). */
function explicacaoStatus(s) {
  return {
    pendente_revisao: "aguarda validação humana: nenhum evento vira estatística de priorização sem um operador confirmar.",
    confirmado: "um operador confirmou a ocorrência — só agora ela conta na priorização.",
    confirmado_multa: "confirmado por operador em modo de autuação, com instrumento certificado.",
    rejeitado: "um operador revisou e descartou — não entra na priorização, mas fica registrado.",
  }[s] || "";
}
/* Escapa tudo que vem da API antes de entrar no HTML: campos passam pelo nó e
   por observação de operador, e nenhum dos dois é lugar de confiar cegamente. */
function texto(valor) {
  if (valor == null) return "";
  return String(valor).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

    { tela: "revisao", abrir: true, alvo: ".grade-medidas", titulo: "O que o nó mediu",
      corpo: "Score do classificador, ângulo da fonte (com margem de erro) e nível sonoro. O nível vem do array e é <b>estimativa sem valor legal</b> — o sistema é honesto sobre isso na própria tela." },
    { tela: "revisao", abrir: true, alvo: ".porque", titulo: "O porquê do resultado",
      corpo: "A leitura em uma frase: por que o evento é <b>acionar</b>, <b>ambíguo</b> ou <b>descartar</b>, e por que está <b>pendente</b> (esperando o operador). A decisão do nó é determinística e versionada." },
    { tela: "revisao", abrir: true, alvo: ".regras", titulo: "As regras, uma a uma",
      corpo: "A decisão não é caixa-preta: são regras explícitas, cada uma com o que se esperava e o que se mediu. É o que transforma \"o sistema decidiu\" em \"decidiu por estas razões\"." },
    { tela: "revisao", abrir: true, alvo: ".decisao", titulo: "A validação humana",
      corpo: "Confirmar ou rejeitar, com observação registrada em nome do operador. Só o que for confirmado entra na priorização — e a decisão nunca se apaga, corrige-se por cima." },
    { tela: "auditoria", alvo: ".grade-cartoes", titulo: "À prova de adulteração", admin: true,
      corpo: "Cada passo — recebimento, acesso à evidência, decisão — é encadeado por hash. Mexer no histórico quebra a cadeia, e o painel acusa na hora." },
    { alvo: ".marca-lateral", titulo: "Pronto",
      corpo: "Explore à vontade. O cenário é de <b>Piracicaba</b>, com pontos tirados de documentos públicos — mas os volumes são construídos, não medidos: a campanha de gravação em campo é o passo seguinte. Clique no <b>?</b> no canto para rever este guia." },
  ];

  let idx = 0, hi = null, card = null, ativo = false;

  function esperar(sel, tentativas) {
    return new Promise((resolve) => {
      let n = tentativas || 40;
      (function tenta() {
        const el = document.querySelector(sel);
        if (el) return resolve(el);
        if (--n <= 0) return resolve(null);
        setTimeout(tenta, 50);
      })();
    });
  }

  async function prepararTela(passo) {
    if (passo.tela && typeof irPara === "function") {
      irPara(passo.tela);
      await esperar(".conteudo .topo-tela", 40);
    }
    if (passo.abrir) {
      const item = document.querySelector(".lista-eventos .item");
      if (item && typeof abrirEvento === "function") {
        abrirEvento(Number(item.dataset.id));
        await esperar("#detalhe .grade-medidas", 60);
      }
    }
  }

  function limpar() {
    hi && hi.remove(); card && card.remove(); hi = null; card = null;
  }

  async function mostrar(i, dir) {
    dir = dir || 1;
    if (i < 0 || i >= passos.length) return finalizar();
    const passo = passos[i];
    // pula o passo de admin quando o acesso é de operador (sem a aba Auditoria);
    // a presença da aba no menu é o sinal de RBAC, sem depender de estado interno.
    if (passo.admin && !document.querySelector('[data-tela="auditoria"]')) {
      return mostrar(i + dir, dir);
    }
    idx = i;
    await prepararTela(passo);
    let alvo = await esperar(passo.alvo, 40);
    if (!alvo) alvo = document.querySelector(".marca-lateral");
    alvo.scrollIntoView({ block: "center", behavior: "instant" });
    await new Promise((r) => setTimeout(r, 160));
    posicionar(alvo, i);
  }

  function posicionar(alvo, i) {
    limpar();
    const r = alvo.getBoundingClientRect();
    const pad = 6;
    hi = document.createElement("div");
    hi.className = "tour-hi";
    hi.style.left = Math.max(4, r.left - pad) + "px";
    hi.style.top = Math.max(4, r.top - pad) + "px";
    hi.style.width = Math.min(window.innerWidth - 8, r.width + pad * 2) + "px";
    hi.style.height = (r.height + pad * 2) + "px";
    document.body.appendChild(hi);

    const passo = passos[i];
    card = document.createElement("div");
    card.className = "tour-card";
    card.innerHTML =
      `<div class="passo-n">${i + 1} de ${passos.length}</div>
       <h4>${passo.titulo}</h4><p>${passo.corpo}</p>
       <div class="tour-botoes">
         <button class="tour-pular">Pular</button><span class="espaco"></span>
         ${i > 0 ? '<button class="tour-ant">Anterior</button>' : ""}
         <button class="tour-prox">${i === passos.length - 1 ? "Concluir" : "Próximo"}</button>
       </div>`;
    document.body.appendChild(card);

    // posiciona o cartão: abaixo do alvo se couber, senão acima; preso à tela.
    const cr = card.getBoundingClientRect();
    let top = r.bottom + 12;
    if (top + cr.height > window.innerHeight - 12) top = r.top - cr.height - 12;
    if (top < 12) top = 12;
    let left = r.left;
    if (left + cr.width > window.innerWidth - 12) left = window.innerWidth - cr.width - 12;
    if (left < 12) left = 12;
    card.style.top = top + "px";
    card.style.left = left + "px";

    card.querySelector(".tour-prox").onclick = () => mostrar(i + 1, 1);
    const ant = card.querySelector(".tour-ant");
    if (ant) ant.onclick = () => mostrar(i - 1, -1);
    card.querySelector(".tour-pular").onclick = finalizar;
  }

  function finalizar() {
    limpar();
    ativo = false;
    try { localStorage.setItem(CHAVE, "1"); } catch (e) {}
  }

  function iniciar() {
    if (ativo) return;
    ativo = true;
    mostrar(0);
  }

  function montarBotao() {
    if ($("tour-ajuda")) return;
    const b = document.createElement("button");
    b.id = "tour-ajuda";
    b.className = "tour-ajuda";
    b.title = "Rever o guia";
    b.textContent = "?";
    b.onclick = iniciar;
    document.body.appendChild(b);
  }

  window.addEventListener("resize", () => { if (ativo) posicionar(document.querySelector(passos[idx].alvo) || document.querySelector(".marca-lateral"), idx); });

  window.__ecoarTour = {
    aoEntrar() {
      montarBotao();
      let visto = false;
      try { visto = !!localStorage.getItem(CHAVE); } catch (e) {}
      if (!visto) iniciar();
    },
    iniciar,
  };
})();
</script>
</body>
</html>
