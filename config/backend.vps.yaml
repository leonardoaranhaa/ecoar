# Configuração de DEMONSTRAÇÃO em VPS — o mesmo cenário de Piracicaba da
# backend.demo.yaml, mas endurecida para uma máquina exposta na internet.
#
# Diferença que importa: aqui NENHUM token tem padrão embutido. Se a variável
# de ambiente não estiver definida, o backend recusa subir (fail-closed, regra 3
# do projeto). Numa caixa com IP público, token fraco em arquivo é vazamento —
# os tokens vêm do ambiente (deploy/.env, gerado por deploy/gerar-env.sh) e
# nunca entram no repositório.
#
# Sobe pelo Docker Compose em deploy/. Ver deploy/README.md.

banco: "dados/vps/ecoar.db"
armazenamento: "dados/vps/pacotes"
tamanho_maximo_pacote_mb: 64

tokens:
  piracicaba-kennedy-01: "${ECOAR_TOKEN_NO_01}"
  piracicaba-centro-hospitalar-02: "${ECOAR_TOKEN_NO_02}"
  piracicaba-joao-conceicao-03: "${ECOAR_TOKEN_NO_03}"
  piracicaba-sao-dimas-04: "${ECOAR_TOKEN_NO_04}"
  piracicaba-rua-do-porto-05: "${ECOAR_TOKEN_NO_05}"
tokens_operador:
  operador-transito: "${ECOAR_TOKEN_OPERADOR}"
  admin-studio-cerne: "${ECOAR_TOKEN_ADMIN}"
